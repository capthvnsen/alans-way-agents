# Orgo sshd hardening — key-only access for VM-as-a-server.
# Extracted from the real template's env-notes.txt; the 00- prefix keeps this
# first in sshd's Include glob so no later drop-in (e.g. cloud-init's) can
# outrank it for first-value-wins keywords.

# ── Authentication: keys only, no passwords, anywhere ──
PasswordAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
KbdInteractiveAuthentication no
UsePAM yes

# Relative, which is the OpenSSH default and resolves per-account.
AuthorizedKeysFile .ssh/authorized_keys

# ── Audit ──
LogLevel VERBOSE

# ── Bounding what an UNAUTHENTICATED peer can consume ──
# The guest's :22 is DNAT'd from a public host port, so every scanner on the
# internet reaches it. Client-side connections should use
#   ssh -i ~/.ssh/orgo -o IdentitiesOnly=yes -p <port> root@<host>
# so the agent does not volunteer extra identities against MaxAuthTries.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60

# Reap sessions whose client vanished instead of holding memory and a pty.
ClientAliveInterval 300
ClientAliveCountMax 2

# ── Forwarding ──
X11Forwarding no
PermitTunnel no
# Forwarding is a product feature, pinned ON so a later hardening drop-in
# cannot quietly take it away.
AllowTcpForwarding yes
AllowAgentForwarding yes
