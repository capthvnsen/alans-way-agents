[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
startretries=10
; /var/log/orgo is on the persistent rootfs; /tmp is tmpfs (init.sh mounts it),
; so the previous destination destroyed the auth log on every reboot. That log is
; the ONLY record that anyone ever logged into this VM over SSH, and on a live
; customer VM inspected 2026-09-06 the files did not exist at all.
;
; This path is also the convention the Desktop API already serves:
; GET /logs/sshd tails /var/log/orgo/sshd.log, subject to the template's
; telemetry.logs allowlist — so exposing it is opt-in per template, while the
; durability below is unconditional.
;
; -e sends sshd's log to stderr, so both streams are merged into one file: an
; auth timeline split across two files is not a timeline.
redirect_stderr=true
stdout_logfile=/var/log/orgo/sshd.log
; Bounded on purpose. A durable log that grows forever fills the customer's disk;
; supervisord's own rotation keeps 5 x 10MB. LogLevel VERBOSE (sshd_orgo.conf)
; makes each line carry a key fingerprint, so 50MB is a lot of history.
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
