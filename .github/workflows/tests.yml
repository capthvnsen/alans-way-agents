name: tests
on: [push, pull_request]
jobs:
  python:
    name: python (${{ matrix.os }}, Python ${{ matrix.python }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            node: "24"
          - os: macos-latest
            python: "3.11"
            node: "24"
          - os: macos-latest
            python: "3.14"
            node: "26"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HERMES_SCANNER_ROOT: ${{ github.workspace }}/../hermes-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python -m pip install -r shared/requirements.txt
      - name: Fetch pinned upstream Hermes scanner (no Hermes install)
        # rc.38-v0.21.5: matches setup.sh's minimum and reproduces the SSH hard block.
        # Authenticated: anonymous raw.githubusercontent.com fetches got HTTP 429.
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HERMES_SCANNER_ROOT/tools"
          for name in plugin_guard.py plugin_guard_context.py skills_guard.py; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/NousResearch/hermes-agent/contents/tools/$name?ref=08165d58931841cee713468ae89032af7c57060a" \
              > "$HERMES_SCANNER_ROOT/tools/$name"
          done
      - name: Python discovery (including router subprocess tests)
        timeout-minutes: 20
        run: |
          python3 --version
          node --version
          python3 -m unittest discover -s tests -v
      - name: Router suites (real-connector cases explain their skips)
        timeout-minutes: 5
        run: node --test tests/*.test.cjs
      - run: python scripts/check_publication.py
